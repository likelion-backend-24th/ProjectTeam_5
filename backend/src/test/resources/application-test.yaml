spring:
  datasource:
    url: jdbc:h2:mem:findanswer;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google_client_secret}
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_REST_API_KEY:kakao_rest_api_key}
            client-secret: ${KAKAO_CLIENT_SECRET:kakao_client_secret}
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:testuser}
    password: ${MAIL_PASSWORD:testpassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


jwt:
  secret: jwt-secret-key-dev-secret-unsafe-not-secure
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 1209600000


app:
  oauth2:
    success-redirect-uri: https://like-lion-team5-find-answer.vercel.app/oauth/callback
    failure-redirect-uri: https://like-lion-team5-find-answer.vercel.app/login
  upload:
    dir: ${UPLOAD_DIR:./uploads}

kakao:
  admin-key: kakao-admin-key-secret

cloudinary:
  url: ${CLOUDINARY_URL:cloudinary://key:secret@cloudname}          # cloudinary://key:secret@cloudname
  folder: findanswer/posts

portone:
  store-id: ${PORTONE_STORE_ID:store-test-0000}
  channel-key-payment: ${PORTONE_CHANNEL_KEY_PAYMENT:channel-key-test-0000}
  channel-key-billing: ${PORTONE_CHANNEL_KEY_BILLING:channel-key-test-0000}
  api-secret: ${PORTONE_API_SECRET:portone-test-api-secret}
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  payment-id-prefix: ${PORTONE_PAYMENT_ID_PREFIX:MB}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:whsec_0poG6m2/caXMxIy8DbyBj1NaNC4R3OzpjQYoNE26cN0=*=}
  billing-issue-id-prefix: ${PORTONE_BILLING_ISSUE_ID_PREFIX:MB-BK}   # ★ 추가

