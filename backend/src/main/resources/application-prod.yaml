spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:aws-1-ap-northeast-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres.jlvnmegmaoksqbnaveef}
    password: ${DB_PASSWORD:findanser-dev}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
#              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}

app:
  oauth2:
    success-redirect-uri: https://like-lion-team5-find-answer.vercel.app/oauth/callback
    failure-redirect-uri: https://like-lion-team5-find-answer.vercel.app/login
  upload:
    dir: ${UPLOAD_DIR:./uploads}

server:
  forward-headers-strategy: framework

kakao:
  admin-key: ${KAKAO_ADMIN_KEY:kakao_admin_key}

cloudinary:
  url: ${CLOUDINARY_URL:cloudinary://key:secret@cloudname}          # cloudinary://key:secret@cloudname
  folder: findanswer/posts


portone:
  store-id: ${PORTONE_STORE_ID}
  channel-key-payment: ${PORTONE_CHANNEL_KEY_PAYMENT}
  channel-key-billing: ${PORTONE_CHANNEL_KEY_BILLING}
  api-secret: ${PORTONE_API_SECRET}
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
  payment-id-prefix: ${PORTONE_PAYMENT_ID_PREFIX:MB}
