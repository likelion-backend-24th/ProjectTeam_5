spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:aws-1-ap-northeast-2.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres.jlvnmegmaoksqbnaveef}
    password: ${DB_PASSWORD:findanser-dev}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google_client_secret}
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_REST_API_KEY:kakao_rest_api_key}
            client-secret: ${KAKAO_CLIENT_SECRET:kakao_client_secret}
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
#              - account_email
        # kakao - CommonOAuth2Provider 내장되어 있지 않음
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET_KEY:jwt-secret-key-dev-secret-unsafe-not-secure}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}

app:
  oauth2:
    failure-redirect-uri: ${FAILURE_FRONT_REDIRECT_URI:http://localhost:3000/login}
    success-redirect-uri: ${SUCCESS_FRONT_REDIRECT_URI:http://localhost:3000/oauth/callback}
  upload:
    dir: ${UPLOAD_DIR:./uploads}


server:
  forward-headers-strategy: framework


kakao:
  admin-key: ${KAKAO_ADMIN_KEY:kakao_admin_key}

cloudinary:
  url: ${CLOUDINARY_URL:cloudinary://API_KEY:API_SECRET@CLOUD_NAME}
  folder: findanswer/posts

