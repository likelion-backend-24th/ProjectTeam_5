services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: findanswer-backend:local
    container_name: findanswer-backend
    restart: unless-stopped

    expose:
      - "8080"

    env_file:
      - .env.dev

    environment:
      SPRING_PROFILES_ACTIVE: dev

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - findanswer-network

  mysql:
    image: mysql:8.4
    container_name: findanswer-mysql
    restart: unless-stopped

    env_file:
      - .env.dev

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - findanswer-mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - findanswer-network

  nginx:
    image: nginx:alpine
    container_name: findanswer-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

    depends_on:
      - backend

    networks:
      - findanswer-network

  certbot:
    image: certbot/certbot
    container_name: findanswer-certbot

    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

networks:
  findanswer-network:
    name: findanswer-network

volumes:
  findanswer-mysql-data: