services:
  backend:
    image: 
    container_name: 
    restart:

    ports:
      - "8080:8080"
    
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL:
      DB_USERNAME:
      DB_PASSWORD:

      JWT_SECRET_KEY:


  mysql:
    image: mysql:8.0
    container_name: findanswer-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE:
      MYSQL_USER:
      MYSQL_PASSWORD:
      MYSQL_ROOT_PASSWORD:

    volumes:
      - mysql-data:/var/lib/mysql
      
      
      