services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: findanswer-backend:local
    container_name: findanswer-backend
    restart: unless-stopped

    expose:
      - "8080"

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

    networks:
      - findanswer-network

  nginx:
    image: nginx:alpine
    container_name: findanswer-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

    depends_on:
      - backend

    networks:
      - findanswer-network

  certbot:
    image: certbot/certbot
    container_name: findanswer-certbot

    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

networks:
  findanswer-network:
    name: findanswer-network